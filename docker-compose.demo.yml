services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: gspend-mongodb-demo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=gspend
    volumes:
      - mongodb-demo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gspend-demo-net
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: gspend-redis-demo
    ports:
      - "6379:6379"
    volumes:
      - redis-demo-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gspend-demo-net
    restart: unless-stopped

  # Data Seeder
  data-seeder:
    build:
      context: ./scripts
      dockerfile: Dockerfile.seeder
    container_name: gspend-data-seeder
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=gspend
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gspend-demo-net
    restart: "no"

  # Auth Service
  auth-service:
    build:
      context: ./apps/auth-service
      dockerfile: Dockerfile
    container_name: gspend-auth-demo
    ports:
      - "8081:8081"
      - "9091:9091" # gRPC port
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=gspend
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=demo-jwt-secret-key-for-demo-only
      - REFRESH_SECRET=demo-refresh-secret-key-for-demo-only
      - APP_ENV=development
      - PORT=8081
      - GRPC_PORT=9091
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      data-seeder:
        condition: service_completed_successfully
    networks:
      - gspend-demo-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/api/v1/auth/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Financial Service
  financial-service:
    build:
      context: ./apps/financial-service
      dockerfile: Dockerfile
    container_name: gspend-financial-demo
    ports:
      - "8082:8082"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=gspend
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=demo-jwt-secret-key-for-demo-only
      - APP_ENV=development
      - PORT=8082
      - AUTH_SERVICE_URL=http://auth-service:8081
      - AUTH_SERVICE_GRPC_ADDR=auth-service:9091
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      data-seeder:
        condition: service_completed_successfully
    networks:
      - gspend-demo-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/api/v1/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: gspend-frontend-demo
    environment:
      - VITE_AUTH_SERVICE_URL=http://localhost/api/v1/auth
      - VITE_FINANCIAL_SERVICE_URL=http://localhost/api/v1
    depends_on:
      auth-service:
        condition: service_healthy
      financial-service:
        condition: service_healthy
    networks:
      - gspend-demo-net
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: gspend-nginx-demo
    ports:
      - "80:80"
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - auth-service
      - financial-service
    networks:
      - gspend-demo-net
    restart: unless-stopped

networks:
  gspend-demo-net:
    driver: bridge

volumes:
  mongodb-demo-data:
  redis-demo-data:
