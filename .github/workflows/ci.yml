name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.21'
  NODE_VERSION: '18'

jobs:
  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Run Auth Service Unit Tests
      run: |
        cd apps/auth-service
        go test -v -race -coverprofile=coverage.out ./...
        
    - name: Run Financial Service Unit Tests
      run: |
        cd apps/financial-service
        go test -v -race -coverprofile=coverage.out ./...
        
    - name: Upload Auth Service Coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./apps/auth-service/coverage.out
        flags: auth-service
        name: auth-service-coverage
        
    - name: Upload Financial Service Coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./apps/financial-service/coverage.out
        flags: financial-service
        name: financial-service-coverage

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Create test results directory
      run: mkdir -p test-results
      
    - name: Run Integration Tests
      run: |
        make test-integration
        
    - name: Upload Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: test-results/
        
    - name: Display Test Results
      if: always()
      run: |
        if [ -f test-results/integration-test-results.json ]; then
          echo "Integration Test Results:"
          cat test-results/integration-test-results.json | jq '.'
        fi

  # Build and Security Scan
  build-and-scan:
    name: Build and Security Scan
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: apps/frontend/package-lock.json
        
    - name: Build Auth Service
      run: |
        cd apps/auth-service
        go build -v ./cmd/server
        
    - name: Build Financial Service
      run: |
        cd apps/financial-service
        go build -v ./cmd/server
        
    - name: Build Frontend
      run: |
        cd apps/frontend
        npm ci
        npm run build
        
    - name: Run Go Security Scan
      uses: securecodewarrior/github-action-gosec@master
      with:
        args: './apps/auth-service/... ./apps/financial-service/...'
        
    - name: Run Frontend Security Audit
      run: |
        cd apps/frontend
        npm audit --audit-level=high

  # Docker Build Test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Auth Service Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/auth-service
        file: ./apps/auth-service/Dockerfile
        push: false
        tags: gspend-auth:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build Financial Service Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/financial-service
        file: ./apps/financial-service/Dockerfile
        push: false
        tags: gspend-financial:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build Frontend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/frontend
        file: ./apps/frontend/Dockerfile
        push: false
        tags: gspend-frontend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deployment (only on main branch)
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, build-and-scan, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to Staging
      run: |
        echo "🚀 Deploying to staging environment..."
        # Add actual deployment commands here
        echo "✅ Deployment complete!"
        
    - name: Run Smoke Tests
      run: |
        echo "🧪 Running smoke tests..."
        # Add smoke test commands here
        echo "✅ Smoke tests passed!"

  # Notification
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, build-and-scan, docker-build]
    if: always()
    
    steps:
    - name: Notify Success
      if: ${{ needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success' && needs.build-and-scan.result == 'success' && needs.docker-build.result == 'success' }}
      run: |
        echo "🎉 All CI/CD checks passed!"
        
    - name: Notify Failure
      if: ${{ needs.unit-tests.result == 'failure' || needs.integration-tests.result == 'failure' || needs.build-and-scan.result == 'failure' || needs.docker-build.result == 'failure' }}
      run: |
        echo "💥 Some CI/CD checks failed!"
        exit 1