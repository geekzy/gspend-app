name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'

jobs:
  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Tidy Auth Service modules
      run: |
        cd apps/auth-service
        go mod tidy
        
    - name: Tidy Financial Service modules  
      run: |
        cd apps/financial-service
        go mod tidy
        
    - name: Run Auth Service Unit Tests
      run: |
        cd apps/auth-service
        go test -v -race -coverprofile=coverage.out ./...
        
    - name: Run Financial Service Unit Tests
      run: |
        cd apps/financial-service
        go test -v -race -coverprofile=coverage.out ./...

  # Build Test
  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: apps/frontend/package-lock.json
        
    - name: Tidy Go modules
      run: |
        cd apps/auth-service && go mod tidy
        cd ../financial-service && go mod tidy
        
    - name: Build Auth Service
      run: |
        cd apps/auth-service
        go build -v ./cmd/server
        
    - name: Build Financial Service
      run: |
        cd apps/financial-service
        go build -v ./cmd/server
        
    - name: Build Frontend
      run: |
        cd apps/frontend
        npm ci
        npm run build

  # Docker Build Test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Auth Service Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/auth-service
        file: ./apps/auth-service/Dockerfile
        push: false
        tags: gspend-auth:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build Financial Service Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/financial-service
        file: ./apps/financial-service/Dockerfile
        push: false
        tags: gspend-financial:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build Frontend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/frontend
        file: ./apps/frontend/Dockerfile
        push: false
        tags: gspend-frontend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Notification
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [unit-tests, build-test, docker-build]
    if: always()
    
    steps:
    - name: Notify Success
      if: ${{ needs.unit-tests.result == 'success' && needs.build-test.result == 'success' && needs.docker-build.result == 'success' }}
      run: |
        echo "🎉 All CI/CD checks passed!"
        
    - name: Notify Failure
      if: ${{ needs.unit-tests.result == 'failure' || needs.build-test.result == 'failure' || needs.docker-build.result == 'failure' }}
      run: |
        echo "💥 Some CI/CD checks failed!"
        exit 1