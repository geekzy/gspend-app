version: '3.8'

services:
  # Frontend
  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    environment:
      - VITE_AUTH_SERVICE_URL=http://localhost/api/v1/auth
      - VITE_FINANCIAL_SERVICE_URL=http://localhost/api/v1
    depends_on:
      - auth-service
      - financial-service
    networks:
      - gspend-net
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: ../../apps/auth-service
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=gspend
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-gspend-secret-key}
      - APP_ENV=development
      - PORT=8081
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gspend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/api/v1/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Financial Service
  financial-service:
    build:
      context: ../../apps/financial-service
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=gspend
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-gspend-secret-key}
      - APP_ENV=development
      - PORT=8082
      - AUTH_SERVICE_URL=http://auth-service:8081
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gspend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # MongoDB Database
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=gspend
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gspend-net
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gspend-net
    restart: unless-stopped

  # Nginx Reverse Proxy (API Gateway)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - auth-service
      - financial-service
    networks:
      - gspend-net
    restart: unless-stopped

networks:
  gspend-net:
    driver: bridge

volumes:
  mongodb-data:
  redis-data:
